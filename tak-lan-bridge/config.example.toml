# tak-lan-bridge config. Copy to /etc/tak-lan-bridge/config.toml (mode 640, group tak-bridge).

[bridge]
name = "home"                      # site id: used in the bridge uid (LANBRIDGE-home) and flow tag
callsign = "LAN-BRIDGE-HOME"
lat = 59.3470                      # where the bridge marker is shown
lon = 18.0730
team = "Cyan"                      # "" = no team: drawn as the 2525 symbol of cot_type
role = "HQ"
# cot_type = "a-f-G-U-U-S-R-W"      # e.g. friendly radio relay (with team = "")
dedupe_seconds = 30                # drop the same (uid, time, type) seen again within this window
sa_interval_seconds = 60           # own SA + takPing to the server
stats_interval_seconds = 300
# loopback_log = "/var/log/tak-lan-bridge/loopback.log"   # DMs to the bridge contact (also in the main log)

[lan]
enabled = true                     # false: Meshtastic gateway only (no multicast), e.g. a laptop behind NAT
interface = "eth0"                 # LAN side. Wired is more reliable for multicast than wlan0
# address = "192.168.1.20"         # overrides the interface lookup
ttl = 1
sa_group = "239.2.3.1:6969"
chat_group = "224.10.10.1:17012"
# Test-only switches (same-host smoke test):
# multicast_loop = true
# ignore_own_ip = false

[server]
host = ""                          # REQUIRED: the OTS address, e.g. its WireGuard IP
port = 8089
tls = true
ca = "/etc/tak-lan-bridge/ca.pem"          # OTS CA (truststore converted to PEM)
cert = "/etc/tak-lan-bridge/client.pem"    # client cert for OTS user "lan-bridge-home"
key = "/etc/tak-lan-bridge/client.key"
# key_password = ""
verify_hostname = true             # needs host (IP or DNS name) in the server cert SAN
# server_hostname = "tak.wg"
queue_size = 1000

[uplink]                           # LAN -> server
rewrite_endpoint = true            # contact endpoint -> "*:-1:stcp" so server users DM via the server

[downlink]                         # server -> LAN
allow_type_prefixes = ["a-", "b-t-f", "b-m-p", "u-d-", "b-a-"]
deny_uid_prefixes = ["ICAO-", "MMSI-", "APRS"]   # keep the big feeds off the LAN (check the uid formats used by OTS/aprscot)
min_interval_seconds = 5           # per-uid rate limit for non-chat events

[meshtastic]                       # Mode B: node on USB/TCP. Do not combine with Mode A for the same node
enabled = false
device = "/dev/ttyACM0"            # or: host = "192.168.1.50" (node on Wi-Fi, TCP API port 4403; one TCP client at a time)
channel_index = 0                  # mesh channel bridged to chat (0 = primary, e.g. public MediumFast)
chatroom = "Meshtastic MediumFast" # GeoChat room for that channel; "All Chat Rooms" to use All Chat instead
# chatroom_id = "MESHTASTIC-Meshtastic MediumFast"
marker_style = "symbol"            # "dot": small spot-map dot (own Overlay Manager group); "symbol": 2525 symbol of cot_type
dot_color = "#67EA94"              # dot colour (#RRGGBB or #AARRGGBB)
cot_type = "a-n-G-U-U-S-R"         # 2525 neutral signal unit, radio (public nodes are not our units)
# Per-role symbols: defaults in ROLE_TYPES (radio, radio relay for routers, sensor, equipment for
# trackers, infantry for TAK roles). Override here:
# [meshtastic.role_types]
# TRACKER = "a-n-G-E-V"
marker_max_age_minutes = 180       # marker stale = last heard + this
sweep_interval_seconds = 300       # republish recently heard nodes from the node database
sweep_rate = 10                    # markers per second during a sweep (bursts can stall OTS)
full_sweep_every = 6               # every Nth sweep is full; the others only send nodes heard since
chat_to_mesh = true                # messages posted in the room -> mesh broadcast on channel_index
all_chat_to_mesh = false           # also forward All Chat Rooms
show_tak_callsign = false          # prefix mesh texts with "<TAK callsign>: " (always logged either way)
chat_from_lan = true
chat_min_interval_seconds = 15     # EU868 duty cycle: keep mesh chat sparse
to_lan = true                      # also show mesh nodes/chat on the LAN multicast
# Channel rooms: "channel add <https://meshtastic.org/e/#... link>" in a DM to the bridge contact adds that
# channel to the node (free secondary slot; the node's LoRa settings are never changed) with its own
# GeoChat room. Open to every TAK user for now; the authority hook is Bridge._may().
# channels_file = "/var/lib/tak-lan-bridge/channels.json"   # registry (names only, no keys).
#                                    # Default: channels.json next to this config (read-only /etc: set this)
# channel_room_prefix = "Meshtastic " # room name = prefix + channel name
